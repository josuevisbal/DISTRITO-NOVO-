<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ícono de la app: el logotipo de la marca (D + DISTRITO + Nv) sobre el negro.
       Para usar el arte final: reemplaza este archivo (y favicon.ico); el nombre
       se mantiene para no tocar código. -->
  <rect width="512" height="512" rx="112" fill="#0B0B0C"/>
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#8A6A25" stroke-width="3" opacity="0.7"/>

  <!-- La D grande -->
  <text x="256" y="298" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="330" fill="#F3E3B2">D</text>

  <!-- Banda dorada cruzándola -->
  <text x="256" y="228" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="52" letter-spacing="5" fill="#D4A64A"
        stroke="#0B0B0C" stroke-width="16" paint-order="stroke">-DISTRITO-</text>

  <!-- Óvalo con el Nv -->
  <ellipse cx="256" cy="398" rx="128" ry="82" fill="none" stroke="#F3E3B2" stroke-width="13"/>
  <text x="242" y="430" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="118" fill="#F3E3B2">N</text>
  <text x="322" y="438" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="62" fill="#F3E3B2">v</text>
</svg>
